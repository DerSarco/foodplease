name: Build FoodPlease APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    name: Verify and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare downloadable file
        run: cp build/app/outputs/flutter-apk/app-release.apk FoodPlease.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FoodPlease-APK
          path: FoodPlease.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="v1.0.0"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" FoodPlease.apk --clobber
          else
            gh release create "$RELEASE_TAG" FoodPlease.apk \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "FoodPlease $RELEASE_TAG"
          fi
